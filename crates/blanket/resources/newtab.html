<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>New Tab</title>
<style>
  /* The page always sits on the dark liquid-silk artwork, so it uses one dark scheme
     whatever the system preference is. */
  :root {
    --text: #f4f5f7;
    --dim: rgba(236, 238, 241, 0.72);
    --faint: rgba(236, 238, 241, 0.45);
    --glass: rgba(16, 18, 22, 0.46);
    --glass-hover: rgba(40, 44, 50, 0.62);
    --stroke: rgba(255, 255, 255, 0.12);
    --edge: rgba(255, 255, 255, 0.24);
    --accent: #3dd68c;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  html { background: #030304; }
  body {
    position: relative;
    min-height: 100%;
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px 72px;
    overflow-x: hidden;
  }
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: #030304;
  }
  .backdrop img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transform: scale(1.06);
    animation: settle 1.6s var(--ease) 0.05s forwards;
  }
  /* Darken the edges and the middle band so text stays legible on bright folds. */
  .backdrop::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 52%, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0) 70%),
      linear-gradient(180deg, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0.05) 35%, rgba(0, 0, 0, 0.05) 65%, rgba(0, 0, 0, 0.6) 100%);
  }
  main {
    position: relative;
    z-index: 1;
    width: min(760px, 100%);
    text-align: center;
  }
  .rise {
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.7s var(--ease) forwards;
  }
  .d1 { animation-delay: 0.12s; }
  .d2 { animation-delay: 0.22s; }
  .d3 { animation-delay: 0.32s; }
  .d4 { animation-delay: 0.42s; }
  h1 {
    margin: 0;
    font-size: 44px;
    font-weight: 650;
    letter-spacing: -1px;
    text-shadow: 0 2px 24px rgba(0, 0, 0, 0.55);
  }
  .tagline {
    margin: 10px 0 0;
    color: var(--dim);
    font-size: 17px;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6);
  }
  form {
    margin: 30px auto 0;
    max-width: 640px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--glass);
    border: 1px solid var(--stroke);
    border-top-color: var(--edge);
    border-radius: 999px;
    padding: 6px 6px 6px 22px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
    transition: border-color 0.25s var(--ease), background-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
  }
  form:hover { background: var(--glass-hover); }
  form:focus-within {
    border-color: var(--accent);
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45), 0 0 0 4px rgba(61, 214, 140, 0.16);
  }
  input[type=search] {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--text);
    font: inherit;
    font-size: 16px;
    padding: 9px 0;
  }
  input[type=search]::placeholder { color: var(--faint); }
  button {
    border: 1px solid var(--stroke);
    border-top-color: var(--edge);
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    padding: 9px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 0.2s var(--ease), transform 0.2s var(--ease);
  }
  button:hover { background: rgba(255, 255, 255, 0.16); }
  button:active { transform: scale(0.96); }
  .sites:empty { display: none; }
  .sites {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 12px;
    margin: 28px auto 0;
    max-width: 680px;
  }
  .site {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    padding: 16px 8px 13px;
    border-radius: 18px;
    background: var(--glass);
    border: 1px solid var(--stroke);
    border-top-color: var(--edge);
    color: var(--text);
    text-decoration: none;
    font-size: 12.5px;
    overflow: hidden;
    transition: background-color 0.22s var(--ease), transform 0.22s var(--ease), box-shadow 0.22s var(--ease);
  }
  .site:hover {
    background: var(--glass-hover);
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
  }
  .site:active { transform: translateY(-1px) scale(0.98); }
  .badge {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 650;
    color: #fff;
  }
  .site span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  footer {
    position: fixed;
    z-index: 1;
    left: 0;
    right: 0;
    bottom: 18px;
    text-align: center;
    color: var(--faint);
    font-size: 12px;
    opacity: 0;
    animation: fade 1s var(--ease) 0.7s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes settle { to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    .rise, .backdrop img, footer { animation: none; opacity: 1; transform: none; }
  }
  @media (max-height: 560px) {
    body { justify-content: flex-start; }
    footer { position: static; margin-top: 32px; }
  }
</style>
</head>
<body>
<div class="backdrop"><img src="blanket:silk" alt="" width="1280" height="720"></div>
<main>
  <h1 class="rise">Browse without limits.</h1>
  <p class="tagline rise d1">Lightweight by design. Powerful by nature.</p>
  <form class="rise d2" action="{{SEARCH_ACTION}}" method="get" role="search">
    <input type="search" name="{{QUERY_NAME}}" placeholder="Search with {{ENGINE_NAME}}" autocomplete="off" autofocus>
    {{SEARCH_FIELDS}}
    <button type="submit">Search</button>
  </form>
  <nav class="sites rise d3">{{TOP_SITES}}</nav>
</main>
<footer>Built with Rust · Powered by Servo · Blanket {{VERSION}}</footer>
</body>
</html>
